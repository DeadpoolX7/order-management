<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .error {
            color: #c00;
            margin-top: 5px;
            font-size: 14px;
        }

        .global-error {
            color: #c00;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<h1>Create Account</h1>



<form th:action="@{/register}"
      th:object="${registrationForm}"
      method="post">

      <div class="global-error"
     th:if="${#fields.hasGlobalErrors()}">

    <p th:each="error : ${#fields.globalErrors()}"
       th:text="${error.defaultMessage}">
        Registration error
    </p>

    </div>

    <div class="field">

        <label for="firstName">
            First Name
        </label>

        <input id="firstName"
               type="text"
               th:field="*{firstName}">

        <div class="error"
             th:if="${#fields.hasErrors('firstName')}"
             th:errors="*{firstName}">
        </div>

    </div>

    <div class="field">

        <label for="lastName">
            Last Name
        </label>

        <input id="lastName"
               type="text"
               th:field="*{lastName}">

        <div class="error"
             th:if="${#fields.hasErrors('lastName')}"
             th:errors="*{lastName}">
        </div>

    </div>

    <div class="field">

        <label for="email">
            Email
        </label>

        <input id="email"
               type="email"
               th:field="*{email}"
               autocomplete="email">

        <div class="error"
             th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}">
        </div>

    </div>

    <div class="field">

        <label for="password">
            Password
        </label>

        <input id="password"
               type="password"
               th:field="*{password}"
               autocomplete="new-password">

        <div class="error"
             th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}">
        </div>

    </div>

    <button type="submit">
        Create Account
    </button>

</form>

</body>

</html>
