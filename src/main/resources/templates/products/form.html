<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${productForm.id == null ? 'Create Product' : 'Edit Product'}">
        Product
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .error {
            color: #c00;
            font-size: 14px;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button,
        a {
            padding: 10px 16px;
        }
    </style>
</head>

<body>

<h1 th:text="${productForm.id == null ? 'Create Product' : 'Edit Product'}">
    Product
</h1>

<form th:action="@{/products/save}"
      th:object="${productForm}"
      method="post">

    <input type="hidden"
           th:field="*{id}">

    <div class="field">

        <label for="name">
            Name
        </label>

        <input id="name"
               type="text"
               th:field="*{name}">

        <div class="error"
             th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}">
        </div>

    </div>

    <div class="field">

        <label for="sku">
            SKU
        </label>

        <input id="sku"
               type="text"
               th:field="*{sku}">

        <div class="error"
             th:if="${#fields.hasErrors('sku')}"
             th:errors="*{sku}">
        </div>

    </div>

    <div class="field">

        <label for="category">
            Category
        </label>

        <input id="category"
               type="text"
               th:field="*{category}">

        <div class="error"
             th:if="${#fields.hasErrors('category')}"
             th:errors="*{category}">
        </div>

    </div>

    <div class="field">

        <label for="price">
            Price
        </label>

        <input id="price"
               type="number"
               step="0.01"
               min="0.01"
               th:field="*{price}">

        <div class="error"
             th:if="${#fields.hasErrors('price')}"
             th:errors="*{price}">
        </div>

    </div>

    <div class="field">

        <label for="description">
            Description
        </label>

        <textarea id="description"
                  th:field="*{description}">
        </textarea>

        <div class="error"
             th:if="${#fields.hasErrors('description')}"
             th:errors="*{description}">
        </div>

    </div>

    <div class="actions">

        <button type="submit">
            Save Product
        </button>

        <a href="/products">
            Cancel
        </a>

    </div>

</form>

</body>
</html>
