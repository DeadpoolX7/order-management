<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        button {
            width: 100%;
            padding: 11px;
            cursor: pointer;
        }

        .message {
            padding: 10px;
            margin-bottom: 20px;
        }

        .error {
            background: #ffe5e5;
            color: #a00;
        }

        .success {
            background: #e5ffe8;
            color: #075b18;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<h1>Sign In</h1>

<div class="message error"
     th:if="${param.error}">

    Invalid email or password.

</div>

<div class="message success"
     th:if="${param.registered}">

    Account created successfully.
    You can now sign in.

</div>

<div class="message success"
     th:if="${param.logout}">

    You have been logged out.

</div>

<form th:action="@{/login}"
      method="post">

    <div class="field">

        <label for="username">
            Email
        </label>

        <input id="username"
               name="username"
               type="email"
               autocomplete="email"
               required>

    </div>

    <div class="field">

        <label for="password">
            Password
        </label>

        <input id="password"
               name="password"
               type="password"
               autocomplete="current-password"
               required>

    </div>

    <button type="submit">
        Sign In
    </button>

</form>

<div class="register">

    Don't have an account?

    <a th:href="@{/register}">
        Create one
    </a>

</div>

</body>

</html>
