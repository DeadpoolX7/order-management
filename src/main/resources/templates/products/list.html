<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        a,
        button {
            padding: 8px 14px;
            text-decoration: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .empty {
            text-align: center;
            padding: 40px;
        }

        form {
            display: inline;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Products</h1>

    <a href="/products/new">
        Add Product
    </a>
</div>

<table th:if="${!products.isEmpty()}">

    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>SKU</th>
        <th>Category</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="product : ${products}">

        <td th:text="${product.id}"></td>

        <td th:text="${product.name}"></td>

        <td th:text="${product.sku}"></td>

        <td th:text="${product.category}"></td>

        <td th:text="${product.price}"></td>

        <td class="actions">

            <a th:href="@{/products/{id}/edit(id=${product.id})}">
                Edit
            </a>

            <form th:action="@{/products/{id}/delete(id=${product.id})}"
                  method="post">

                <button type="submit">
                    Delete
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

<div class="empty" th:if="${products.isEmpty()}">
    <p>No products found.</p>

    <a href="/products/new">
        Create your first product
    </a>
</div>

</body>
</html>
