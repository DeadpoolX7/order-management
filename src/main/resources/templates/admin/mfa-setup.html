<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Set Up Authenticator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        img {
            width: 300px;
            height: 300px;
            margin: 20px 0;
        }

        input {
            width: 180px;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 4px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            cursor: pointer;
        }

        .error {
            color: #c00;
        }

    </style>

</head>

<body>

<h1>Set Up Authenticator</h1>

<p>
    Scan this QR code using Google Authenticator,
    Aegis, Authy, or another compatible TOTP application.
</p>

<img th:src="${qrCode}"
     alt="Authenticator QR code">

<p>
    After scanning, enter the current 6-digit code
    generated by your authenticator.
</p>

<div class="error"
     th:if="${param.error}">

    Invalid verification code.

</div>

<form th:action="@{/admin/mfa/verify-setup}"
      method="post">

    <input
            type="text"
            name="code"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            autocomplete="one-time-code"
            required
    >

    <br>

    <button type="submit">
        Verify & Enable
    </button>

</form>

</body>

</html>
